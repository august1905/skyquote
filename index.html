<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Montserrat is the confirmed brand font for display AND body (Skyline
         parent design system) — Poppins/Mulish were stand-ins and are gone.
         Italic variants are loaded explicitly because index.css sets
         font-synthesis: none, so without them the editor's italic mark would
         render as upright text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>SkyQuotes</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
